services:
  app:
    build: .
    ports:
      - "80:8000"
    env_file:
      - .env.dev
    restart: always
    volumes:
      - .:/app
    # Set the working directory for uvicorn inside the container's /app/backend/
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
