services:
  app:
    build: .
    expose:
      - "8000"
    env_file:
      - .env.dev
    restart: always
    volumes:
      - .:/app
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config: